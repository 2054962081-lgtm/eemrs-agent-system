server:
  port: 8081

spring:
  application:
    name: eemrs-agent-server
  datasource:
    url: ${AGENT_DB_URL:jdbc:mysql://localhost:3306/eemrs?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AGENT_DB_USERNAME:root}
    password: ${AGENT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

llm:
  default-provider: ${LLM_DEFAULT_PROVIDER:deepseek}

  deepseek:
    enabled: ${DEEPSEEK_ENABLED:true}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:180}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
    temperature: ${DEEPSEEK_TEMPERATURE:0.2}
    top-p: ${DEEPSEEK_TOP_P:0.8}

  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3-vl:8b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}

  routing:
    pre-consultation-provider: ${PRE_CONSULTATION_LLM_PROVIDER:deepseek}
    medical-record-draft-provider: ${MEDICAL_RECORD_DRAFT_LLM_PROVIDER:deepseek}
    privacy-provider: ${PRIVACY_LLM_PROVIDER:ollama}

  fallback:
    enabled: ${LLM_FALLBACK_ENABLED:false}
    fallback-provider: ${LLM_FALLBACK_PROVIDER:ollama}

rag:
  enabled: ${RAG_ENABLED:true}
  service-url: ${RAG_SERVICE_URL:http://localhost:18080}
  retrieve-path: ${RAG_RETRIEVE_PATH:/rag/retrieve}
  timeout-ms: ${RAG_TIMEOUT_MS:3000}
  top-k: ${RAG_TOP_K:8}
  max-context-chars: ${RAG_MAX_CONTEXT_CHARS:3000}
  include-doc-types:
    - red_flag
    - symptom_inquiry
    - special_population
    - department_triage
    - medical_record_template
  fail-open: ${RAG_FAIL_OPEN:true}
  debug-log: ${RAG_DEBUG_LOG:true}
